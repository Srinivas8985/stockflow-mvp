version: '3.8'

# ==============================================================================
# StockFlow - Production Docker Compose Stack (AWS EC2 Deployment)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: stockflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-stockflow_prod}
    volumes:
      - stockflow_pgdata:/var/lib/postgresql/data
    networks:
      - stockflow_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockflow} -d ${POSTGRES_DB:-stockflow_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Security: Database is purely internal to the Docker network; no ports exposed to the host

  # ----------------------------------------------------------------------------
  # 2. Express Backend API Service (Prebuilt Docker Image)
  # ----------------------------------------------------------------------------
  backend:
    image: ${BACKEND_IMAGE:-stockflow-backend:latest}
    container_name: stockflow-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      API_PREFIX: /api/v1
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-stockflow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stockflow_prod}?schema=public}
      POSTGRES_USER: ${POSTGRES_USER:-stockflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-stockflow_prod}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CORS_ORIGIN: https://${SERVER_IP},http://${SERVER_IP},http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - stockflow_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    # Security: Backend is purely internal to the Docker network; routed exclusively via Caddy

  # ----------------------------------------------------------------------------
  # 3. Next.js Frontend Application (Prebuilt Docker Image)
  # ----------------------------------------------------------------------------
  frontend:
    image: ${FRONTEND_IMAGE:-stockflow-frontend:latest}
    container_name: stockflow-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: /api/v1
      INTERNAL_API_URL: http://backend:5000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - stockflow_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Security: Frontend is purely internal to the Docker network; routed exclusively via Caddy

  # ----------------------------------------------------------------------------
  # 4. Caddy Reverse Proxy & Automatic Let's Encrypt HTTPS
  # ----------------------------------------------------------------------------
  caddy:
    image: caddy:2.8-alpine
    container_name: stockflow-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SERVER_IP: ${SERVER_IP:?SERVER_IP is required for IP HTTPS}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - stockflow_net

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  stockflow_pgdata:
    name: stockflow_pgdata
  caddy_data:
    name: stockflow_caddy_data
  caddy_config:
    name: stockflow_caddy_config

# ==============================================================================
# Isolated Internal Network
# ==============================================================================
networks:
  stockflow_net:
    name: stockflow_net
    driver: bridge
